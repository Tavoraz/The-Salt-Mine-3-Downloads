name: Check Windows package 0.79.0.7
on:
  push:
    branches: [codex/test-winget-r7]
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate, install, and remove the standalone alpha
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = (Resolve-Path 'winget/manifests/a/Avoraz/TheSaltMine3/0.79.0.7').Path
          $packageKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AvorazSaltMine3'
          $target = Join-Path $env:LOCALAPPDATA 'Programs\The Salt Mine 3'
          if ((Test-Path -LiteralPath $target) -or (Test-Path -LiteralPath $packageKey)) {
            throw 'The runner must have a clean profile.'
          }
          $winget = (Get-Command winget.exe -ErrorAction SilentlyContinue).Source
          if (!$winget) {
            $installer = Get-AppxPackage Microsoft.DesktopAppInstaller
            if ($installer) {
              $winget = Join-Path $installer.InstallLocation 'winget.exe'
            }
          }
          $currentVersion = [version]'0.0'
          if ($winget -and (Test-Path -LiteralPath $winget)) {
            $currentVersion = [version]((& $winget --version).TrimStart('v'))
          }
          if ($currentVersion -lt [version]'1.28.0') {
            Install-Module Microsoft.WinGet.Client -Scope CurrentUser -Repository PSGallery -Force
            Repair-WinGetPackageManager -Latest
            $winget = Join-Path (Get-AppxPackage Microsoft.DesktopAppInstaller).InstallLocation 'winget.exe'
          }
          & $winget --version
          & $winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw "WinGet settings failed ($LASTEXITCODE)." }
          & $winget validate --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw "WinGet validation failed ($LASTEXITCODE)." }
          $arguments = "install --manifest `"$manifest`" --scope user --silent --dependency-source winget --accept-source-agreements --disable-interactivity --verbose-logs"
          $installLog = Join-Path $env:RUNNER_TEMP 'winget-install.txt'
          $installError = Join-Path $env:RUNNER_TEMP 'winget-install-error.txt'
          $install = Start-Process -FilePath $winget -ArgumentList $arguments -PassThru -WindowStyle Hidden -RedirectStandardOutput $installLog -RedirectStandardError $installError
          $deadline = (Get-Date).AddMinutes(5)
          do {
            if ($install.WaitForExit(30000)) { break }
            $installedKey = Test-Path -LiteralPath $packageKey
            $launcher = Test-Path -LiteralPath (Join-Path $target 'TheSaltMine3.exe')
            $stages = @(Get-ChildItem -LiteralPath $target -Directory -Filter '.tsm-stage-*' -Force -ErrorAction SilentlyContinue)
            $processes = Get-Process -Name '*SaltMine*','InstallGuard','smartscreen','consent' -ErrorAction SilentlyContinue
            $processes | Select-Object ProcessName, CPU, MainWindowTitle | Format-Table | Out-Host
            Write-Output "Install progress: registration=$installedKey launcher=$launcher stagingFolders=$($stages.Count)"
          } while ((Get-Date) -lt $deadline)
          $safeLines = Get-Content -LiteralPath $installLog | Select-String -Pattern 'Successfully verified installer hash|Starting package install|Successfully installed|Failed when|Installation cancelled'
          $safeLines | ForEach-Object { Write-Output $_.Line.Trim() }
          if (!$install.HasExited) {
            $diagnosticFolder = Join-Path $env:LOCALAPPDATA 'Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir'
            $log = Get-ChildItem -LiteralPath $diagnosticFolder -Filter '*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($log) {
              $details = Get-Content -LiteralPath $log.FullName -Tail 60
              Write-Output "WinGet diagnostics: silent NSIS switch recorded=$([bool]($details -match '/S\b')); shell execution recorded=$([bool]($details -match 'ShellExecute')); elevation message recorded=$([bool]($details -match 'elevat'))"
            }
            throw 'WinGet did not return within the diagnostic window on this runner.'
          }
          if ($install.ExitCode -ne 0) { throw "WinGet installation failed ($($install.ExitCode))." }
          $installed = Get-ItemProperty -LiteralPath $packageKey
          if ($installed.DisplayVersion -ne '0.79.0.7' -or $installed.Publisher -ne 'Avoraz' -or $installed.DisplayName -ne 'The Salt Mine 3') {
            throw 'The installed registration differs from the release manifest.'
          }
          if ([IO.Path]::GetFullPath($installed.InstallLocation) -ne [IO.Path]::GetFullPath($target)) {
            throw 'Unexpected installation path.'
          }
          foreach ($relative in 'TheSaltMine3.exe','Game\SaltMine3.exe','Uninstall.exe') {
            if (!(Test-Path -LiteralPath (Join-Path $target $relative) -PathType Leaf)) {
              throw "The installation is missing $relative."
            }
          }
          Write-Output 'Verified a clean WinGet install of Avoraz 0.79.0.7, its launcher, game and uninstaller.'
          $process = Start-Process -FilePath (Join-Path $target 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Uninstall failed ($($process.ExitCode))." }
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if (!(Test-Path -LiteralPath $packageKey) -and !(Test-Path -LiteralPath (Join-Path $target 'TheSaltMine3.exe'))) { break }
            Start-Sleep -Seconds 2
          }
          if ((Test-Path -LiteralPath $packageKey) -or (Test-Path -LiteralPath (Join-Path $target 'TheSaltMine3.exe'))) {
            throw 'Uninstall left a registration or launcher behind.'
          }
          Write-Output 'Verified the silent uninstaller removed the game registration and launcher.'
